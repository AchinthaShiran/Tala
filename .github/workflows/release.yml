name: release

# Publishes to PyPI when a version tag is pushed (git tag v3.0.0 && git push --tags).
# Run it by hand ("Run workflow") to rehearse on TestPyPI instead.
# Uses PyPI Trusted Publishing: no API token is stored anywhere. See docs/publishing.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history, needed to verify the tag is on main
      - name: Tag must be on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main ||
            { echo "::error::${GITHUB_REF_NAME} is not on main; merge first, then tag main."; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build twine
      - run: pip install -e ".[dev]"
      - name: Quality gates
        run: |
          ruff check .
          ruff format --check .
          mypy
          lint-imports
          tala packs validate --strict
          pytest
      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(python -c 'import importlib.metadata as m; print(m.version("tala-ai"))')"
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != package version v$version"; exit 1; }
      - name: Build and check
        run: |
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release (or add the files to one made by hand)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            # Keep the notes that were written by hand; only attach the files.
            gh release upload "${GITHUB_REF_NAME}" dist/* install.sh install.ps1 --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* install.sh install.ps1 --generate-notes --title "${GITHUB_REF_NAME}"
          fi
